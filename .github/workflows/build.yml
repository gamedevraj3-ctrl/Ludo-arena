name: Build Ludo Rush APK (arm64)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          if [ -f "ludo-rush-tsx-source.zip" ]; then
            echo "Found ZIP — extracting..."
            unzip -o ludo-rush-tsx-source.zip
            if [ -d "ludo-rush-tsx" ]; then
              echo "Moving files to root..."
              shopt -s dotglob
              mv ludo-rush-tsx/* .
              rmdir ludo-rush-tsx || true
            fi
            ls -la
          fi

      - name: Check package.json
        run: |
          if [ ! -f "package.json" ]; then
            echo "ERROR: package.json not found"
            find . -name "package.json"
            exit 1
          fi
          echo "✅ package.json found"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --save

      - name: Build web app
        run: |
          npm run build || npx vite build || true
          echo "===== Looking for build output ====="
          ls -la
          ls -la dist || true
          ls -la .vercel/output/static || true
          if [ ! -d "dist" ]; then
            echo "No dist found, creating minimal one for Capacitor..."
            mkdir -p dist
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Ludo Rush</title></head><body><div id="root"></div></body></html>' > dist/index.html
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK manually
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME=$HOME/android-sdk
            mkdir -p $ANDROID_HOME/cmdline-tools
            cd /tmp
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
            unzip -q cmdtools.zip -d $ANDROID_HOME/cmdline-tools
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
            echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          fi
          echo "ANDROID_HOME is: $ANDROID_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Setup Capacitor Android
        run: |
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            echo '{"appId":"com.ludorush.game","appName":"Ludo Rush","webDir":"dist"}' > capacitor.config.json
          fi

          if [ ! -d "dist" ] && [ -d ".vercel/output/static" ]; then
            ln -sfn .vercel/output/static dist
          fi

          if [ -d "android" ]; then
            rm -rf android
          fi

          npx cap add android
          npx cap sync android

      - name: Prepare Android project
        working-directory: android
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: List APK files
        run: find android -name "*.apk" -type f

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ludo-rush-arm64-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
