name: Build Ludo Rush APK (arm64)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show current files
        run: |
          echo "===== Root files ====="
          ls -la
          find . -name "*.zip" -o -name "package.json" | head -20

      # ========== ZIP EXTRACT ==========
      - name: Extract source ZIP
        run: |
          if [ -f "ludo-rush-tsx-source.zip" ]; then
            echo "Found ludo-rush-tsx-source.zip — extracting..."
            unzip -o ludo-rush-tsx-source.zip
            if [ -d "ludo-rush-tsx" ]; then
              echo "Moving files from ludo-rush-tsx/ to root..."
              shopt -s dotglob
              mv ludo-rush-tsx/* .
              rmdir ludo-rush-tsx || true
            fi
            echo "===== After extract ====="
            ls -la
          else
            echo "No ZIP found, assuming files are already in root"
          fi

      - name: Check package.json
        run: |
          if [ ! -f "package.json" ]; then
            echo "ERROR: package.json still not found after extract"
            find . -name "package.json"
            exit 1
          fi
          echo "✅ package.json found"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save

      - name: Build web app
        run: |
          npm run build || npx vite build || echo "Build completed with warnings"
          ls -la dist || true
          ls -la .vercel/output/static || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          if [ ! -d "dist" ] && [ -d ".vercel/output/static" ]; then
            ln -sfn .vercel/output/static dist
          fi
          npx cap sync android || true
          npx cap copy android || true

      - name: Prepare Android project
        working-directory: android
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Debug APK (arm64)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: List APK files
        run: find android -name "*.apk" -type f

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ludo-rush-arm64-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
